[package]
name = "tailwind-ast"
version = "0.1.0"
edition = "2021"
description = "Tailwind candidate syntax tree (no host concepts, no CSS emission)"
license = "MPL-2.0"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tailwind-types = { path = "../tailwind-types" }

[dev-dependencies]
serde_json = "1.0"
