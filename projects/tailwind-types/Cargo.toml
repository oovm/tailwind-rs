[package]
name = "tailwind-types"
version = "0.1.0"
edition = "2021"
description = "Neutral Tailwind engine contract types (CompileRequest/Response, Canonical Style Module, diagnostics)"
license = "MPL-2.0"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
miette = { version = "7", default-features = false }

[dev-dependencies]
serde_json = "1.0"
